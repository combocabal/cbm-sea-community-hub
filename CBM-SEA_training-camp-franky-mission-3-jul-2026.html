<html lang="en">
<head>
<meta charset="UTF-8">

<title>Cabal: Infinite COMBO — Franky&#39;s Flag Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
#srch{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;}
:root{--bg:#030810;--surface:#0A1830;--surface2:#12294F;--border:rgba(50,120,255,0.28);--border-hi:rgba(60,140,255,0.5);--g1:#0F3FD8;--g2:#2E7BFF;--g3:#3FA2FF;--glow:30,110,255;--gold:#C79B46;--text:#e2f0ff;--text2:#9AA8C3;--text3:#5A6A8C;}
body{color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse 90% 60% at 75% -10%,rgba(var(--glow),0.16),transparent 60%),radial-gradient(ellipse 80% 70% at 8% 35%,rgba(var(--glow),0.09),transparent 65%),linear-gradient(180deg,var(--surface) 0%,var(--bg) 45%,var(--bg) 100%);background-attachment:fixed;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.6;background:radial-gradient(1.5px 1.5px at 14% 24%,rgba(var(--glow),0.5),transparent 55%),radial-gradient(1.2px 1.2px at 79% 14%,rgba(var(--glow),0.4),transparent 55%),radial-gradient(1.8px 1.8px at 62% 62%,rgba(var(--glow),0.3),transparent 55%),radial-gradient(1.2px 1.2px at 30% 84%,rgba(var(--glow),0.35),transparent 55%),linear-gradient(115deg,transparent 43%,rgba(var(--glow),0.045) 50%,transparent 57%);}
.server-bar{background:rgba(0,0,0,0.6);backdrop-filter:blur(14px);padding:10px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.server-dot{width:8px;height:8px;border-radius:50%;background:var(--g3);box-shadow:0 0 8px rgba(var(--glow),0.8);flex-shrink:0;}
.server-name{font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--g3);}
.server-ver{margin-left:auto;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2px;color:var(--text3);}
.back-link{display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--text2);text-decoration:none;padding:5px 12px;border:1px solid var(--border);border-radius:20px;transition:all .15s;}
.back-link:hover{color:#fff;border-color:var(--border-hi);background:rgba(var(--glow),0.08);}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border);}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 160% at 50% 110%,rgba(var(--glow),0.12) 0%,transparent 60%);pointer-events:none;}
.hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(var(--glow),0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--glow),0.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,0.4) 40%,rgba(0,0,0,0.4) 70%,transparent 100%);}
.hero-inner{position:relative;z-index:1;max-width:min(1400px,96vw);margin:0 auto;padding:28px 32px;display:flex;flex-direction:column;align-items:center;}
.ev-label{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:4px;color:var(--text3);text-transform:uppercase;margin-bottom:14px;}
.ev-title{font-family:'Cinzel',serif;font-weight:800;font-size:clamp(28px,5.5vw,60px);line-height:1;letter-spacing:1px;text-align:center;text-transform:uppercase;margin-bottom:8px;text-shadow:0 0 40px rgba(var(--glow),0.25);}
.ev-title span{background:linear-gradient(135deg,#fff 25%,var(--g3) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ev-sub{font-family:'Cinzel',serif;font-weight:500;font-size:clamp(12px,2vw,18px);letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-bottom:24px;opacity:0.9;}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
.delivered-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--glow),0.1);border:1px solid rgba(var(--glow),0.35);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:600;color:var(--g3);letter-spacing:1.5px;text-transform:uppercase;}
.delivered-dot{width:6px;height:6px;border-radius:50%;background:var(--g3);box-shadow:0 0 6px rgba(var(--glow),0.8);}
.meta-txt{font-family:'Inter',sans-serif;font-size:11px;color:var(--text3);letter-spacing:2px;}
.meta-sep{color:var(--text3);font-size:10px;}
.hero-notice{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;max-width:680px;background:rgba(var(--glow),0.06);backdrop-filter:blur(8px);border:1px solid rgba(var(--glow),0.25);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);padding:16px 20px;margin-top:20px;}
.notice-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
.notice-text{font-size:14px;line-height:1.75;color:var(--text2);}
.notice-text strong{color:var(--g3);font-weight:700;}
@keyframes lineGlowPulse{0%,100%{box-shadow:0 0 6px rgba(6,199,85,0.5);transform:scale(1);}50%{box-shadow:0 0 16px rgba(6,199,85,0.9),0 0 30px rgba(6,199,85,0.45);transform:scale(1.045);}}
.btn-line-contact{display:inline-flex;align-items:center;gap:6px;background:#06C755;color:#fff;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:all .15s;animation:lineGlowPulse 2.2s ease-in-out infinite;}
.btn-line-contact:hover{background:#05a648;transform:scale(1.08);animation-play-state:paused;color:#fff;}
.banner-rewards-wrap{max-width:1040px;margin:28px auto 0;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
@media(max-width:820px){.banner-rewards-wrap{grid-template-columns:1fr;}}
.banner-col img{display:block;width:100%;border-radius:16px;border:1px solid var(--border);box-shadow:0 14px 40px rgba(0,8,30,0.5),0 0 22px rgba(var(--glow),0.15);}
.ev-panel{background:rgba(var(--glow),0.05);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);padding:12px 14px;margin-bottom:14px;}
.ev-panel-label{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:8px;}
.ev-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.ev-tab{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;padding:6px 14px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;}
.ev-tab.active{color:#fff;background:linear-gradient(180deg,var(--g2),var(--g1));border-color:transparent;box-shadow:0 4px 14px rgba(var(--glow),0.35);}
.section-lbl{font-family:'Cinzel',serif;font-size:18px;font-weight:700;letter-spacing:1px;color:var(--text);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.section-lbl::before{content:'✦';font-size:15px;color:var(--g3);text-shadow:0 0 12px rgba(var(--glow),0.8);flex-shrink:0;}
.section-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--glow),0.55),transparent);box-shadow:0 0 10px rgba(var(--glow),0.4);}
.rw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:7px;}
.rw-card{background:rgba(var(--glow),0.05);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);padding:9px 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:all .15s;}
.rw-card:hover{background:var(--surface2);border-color:var(--border-hi);transform:translateY(-1px);}
.rw-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;}
.rw-qty{font-family:'Inter',sans-serif;font-size:15px;font-weight:800;color:var(--g3);flex-shrink:0;letter-spacing:1px;}
.stats-strip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(var(--glow),0.04);backdrop-filter:blur(8px);margin-top:32px;}
.stats-inner{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;}
.stat{flex:1;min-width:120px;padding:18px 0;text-align:center;}
.stat-n{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:var(--g3);display:block;letter-spacing:1px;}
.stat-l{font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:3px;}
.body{display:block;width:100%;max-width:1040px;margin:0 auto;padding:36px 24px 80px;}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search-wrap{margin-left:auto;position:relative;}
.search-wrap input{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:8px 14px 8px 36px;width:240px;outline:none;transition:all .15s;}
.search-wrap input:focus{background:var(--surface2);border-color:var(--border-hi);}
.s-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none;}
.cnt-badge{font-family:'Inter',sans-serif;font-size:12px;color:var(--text3);letter-spacing:1px;padding:5px 12px;background:var(--surface);border-radius:5px;}
.tbl-wrap{background:rgba(var(--glow),0.04);backdrop-filter:blur(8px);border-radius:16px;overflow-x:auto;border:1px solid var(--border);box-shadow:0 14px 40px rgba(0,8,30,0.45),inset 0 1px 0 rgba(255,255,255,0.05);}
.tbl-bar{height:3px;background:linear-gradient(90deg,var(--g1) 0%,var(--g3) 50%,var(--g1) 100%);}
table{width:100%;min-width:860px;border-collapse:collapse;font-size:14px;table-layout:fixed;}
thead tr{background:var(--surface2);}
th{font-size:11px;font-weight:700;letter-spacing:0.5px;color:var(--text3);text-transform:uppercase;padding:10px 12px;text-align:left;}
th:first-child{width:44px;text-align:center;}
tbody tr{transition:background .1s;}
tbody tr:hover{background:var(--surface2);}
td{padding:9px 12px;vertical-align:middle;}
.td-no{text-align:center;font-family:'Inter',sans-serif;font-size:13px;color:var(--text3);font-weight:600;}
.td-name{font-size:14px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-reward{font-size:11px;font-weight:700;color:var(--g3);background:rgba(var(--glow),0.12);border:1px solid rgba(var(--glow),0.35);border-radius:20px;padding:3px 10px;font-family:'Inter',sans-serif;letter-spacing:.04em;display:inline-block;white-space:nowrap;}
.td-aid{font-family:'Inter',sans-serif;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lnk{display:inline-flex;align-items:center;gap:5px;color:#fff;text-decoration:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:1px;background:linear-gradient(180deg,var(--g2),var(--g1));padding:7px 15px;border-radius:10px;box-shadow:0 4px 14px rgba(var(--glow),0.3),inset 0 1px 0 rgba(255,255,255,0.2);transition:all .15s;white-space:nowrap;}
.lnk:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 6px 20px rgba(var(--glow),0.45);}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--g3);}
.sd{width:6px;height:6px;border-radius:50%;background:var(--g3);}
.no-res{text-align:center;padding:48px;color:var(--text3);font-family:'Inter',sans-serif;font-size:13px;letter-spacing:2px;}
.fb-strip{display:flex;align-items:center;gap:10px;margin-top:40px;padding:20px;background:rgba(var(--glow),0.05);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);flex-wrap:wrap;}
.fb-label{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:var(--text3);width:100%;margin-bottom:6px;}
.fb-btn{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:14px;font-weight:600;background:var(--surface2);padding:11px 16px;border-radius:8px;transition:all .2s;border:1px solid var(--border);flex:1;min-width:160px;justify-content:space-between;}
.fb-btn:hover{border-color:var(--border-hi);color:var(--g3);transform:translateY(-2px);}
.fb-tag{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2px;color:var(--g3);background:rgba(var(--glow),0.1);border:1px solid rgba(var(--glow),0.3);border-radius:4px;padding:2px 7px;}
.footer-bar{border-top:1px solid var(--border);margin-top:16px;padding:14px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:1.5px;color:var(--text3);text-transform:uppercase;}
.footer-sep{color:var(--border-hi);}
@media(max-width:600px){.body{padding:24px 12px 60px;}table{font-size:13px;}.td-aid{display:none;}th:nth-child(3){display:none;}}
.logo-wrap{padding:20px 24px 0;background:transparent;display:flex;justify-content:center;}
.game-logo{height:90px;width:auto;max-width:260px;mix-blend-mode:screen;filter:drop-shadow(0 0 28px rgba(var(--glow),0.4));}
</style>
</head>

    var base = ev.winners;
    if (activeTier !== "__ALL__") base = winnersOf(ev, activeTier);
    var list = q ? base.filter(function(w){ return (w.n + " " + w.a).toLowerCase().indexOf(q) !== -1; }) : base;
    document.getElementById("tbody").innerHTML = list.length ? renderRows(ev, list) : "<tr><td colspan=\"6\" class=\"no-res\">NO RESULTS FOUND</td></tr>";
    document.getElementById("cnt").textContent = list.length + " players";
  }
  function selectTier(key) {
    activeTier = key;
    document.querySelectorAll("#tier-tabs .ev-tab").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-k") === String(key)); });
    var ev = EVENTS[activeEventIdx];
    var tier = ev.tiers.filter(function(t){ return t.key === key; })[0];
    document.getElementById("rw-zone").innerHTML = tier ? "<div class=\"section-lbl\">🏆 " + esc(tier.label) + "</div>" + tierRewardsHtml(tier) : "";
    refreshTable();
  }
  function selectEvent(idx) {
    activeEventIdx = idx;
    var ev = EVENTS[idx];
    document.querySelectorAll("#activity-tabs .ev-tab").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-i") === String(idx)); });
    document.title = SV.brand + " — " + ev.eventName;
    document.getElementById("hero-title").textContent = ev.eventName;
    document.getElementById("hero-date").textContent = ev.date || "";
    document.getElementById("server-ver").textContent = ev.date || "";
    document.getElementById("hero-winners").textContent = ev.winners.length + " WINNERS";
    var noticeHtml = ev.notice ? esc(ev.notice) : "Reward redemption is available exclusively through the <strong>official website</strong>." + (ev.deadline ? " Winners must redeem their prizes before <strong>" + esc(ev.deadline) + "</strong>." : " Winners have <strong>7 days</strong> from the distribution date to redeem their prizes.") + " Please ensure you complete your claim before the deadline.";
    document.getElementById("hero-notice-text").innerHTML = noticeHtml;
    document.getElementById("banner-zone").innerHTML = ev.banner ? "<img src=\"" + ev.banner + "\" alt=\"" + esc(ev.eventName) + "\">" : "";
    document.getElementById("footer-eventname").textContent = ev.eventName + " — Reward Announcement";
    document.getElementById("footer-date").textContent = ev.date || "";
    var multiTier = ev.tiers.length > 1;
    document.getElementById("tier-panel-label").textContent = multiTier ? "Select Prize" : "Prize";
    document.getElementById("tier-tabs").innerHTML = ev.tiers.map(function(t){ return "<button class=\"ev-tab\" data-k=\"" + esc(t.key) + "\">" + esc(t.label) + "</button>"; }).join("");
    document.querySelectorAll("#tier-tabs .ev-tab").forEach(function(b){ b.addEventListener("click", function(){ selectTier(b.getAttribute("data-k")); }); });
    selectTier(ev.tiers.length ? ev.tiers[0].key : "__ALL__");
  }
  function render() {
    var multiEvent = EVENTS.length > 1;
    app.innerHTML =
      "<div class=\"server-bar\">" + (hubUrl() ? "<a class=\"back-link\" href=\"" + hubUrl() + "\">← Back to Community Hub</a>" : "") + "<div class=\"server-dot\"></div><div class=\"server-name\">" + esc(SV.bar) + "</div><div class=\"server-ver\" id=\"server-ver\"></div></div>" +
      "<div class=\"logo-wrap\"><img class=\"game-logo\" alt=\"" + esc(SV.brand) + "\" src=\"assets/logo-CBM.webp\" onerror=\"this.parentNode.style.display='none'\"></div>" +
      "<div class=\"hero\"><div class=\"hero-inner\">" +
        "<div class=\"ev-label\">Reward Announcement</div>" +
        "<h1 class=\"ev-title\"><span id=\"hero-title\"></span></h1>" +
        "<div class=\"ev-sub\">Official Winner List</div>" +
        "<div class=\"meta-row\">" +
          "<a class=\"btn-line-contact\" href=\"" + su(SV.line) + "\" target=\"_blank\" rel=\"noopener\">💬 Contact Support</a>" +
          "<span class=\"meta-sep\">·</span>" +
          "<div class=\"delivered-pill\"><span class=\"delivered-dot\"></span>Delivered</div>" +
          "<span class=\"meta-sep\">·</span>" +
          "<div class=\"meta-txt\" id=\"hero-date\"></div>" +
          "<span class=\"meta-sep\">·</span>" +
          "<div class=\"meta-txt\" id=\"hero-winners\"></div>" +
        "</div>" +
        "<div class=\"hero-notice\"><div class=\"notice-icon\">🌐</div><div class=\"notice-text\" id=\"hero-notice-text\"></div></div>" +
      "</div></div>" +
      "<div class=\"banner-rewards-wrap\">" +
        "<div class=\"banner-col\" id=\"banner-zone\"></div>" +
        "<div class=\"rewards-col\">" +
          (multiEvent ? "<div class=\"ev-panel\"><div class=\"ev-panel-label\">Select Activity</div><div class=\"ev-tabs\" id=\"activity-tabs\">" + EVENTS.map(function(ev, i){ return "<button class=\"ev-tab\" data-i=\"" + i + "\">" + esc(ev.eventName) + "</button>"; }).join("") + "</div></div>" : "") +
          "<div class=\"ev-panel\"><div class=\"ev-panel-label\" id=\"tier-panel-label\"></div><div class=\"ev-tabs\" id=\"tier-tabs\"></div></div>" +
          "<div id=\"rw-zone\"></div>" +
        "</div>" +
      "</div>" +
      "<div class=\"stats-strip\"><div class=\"stats-inner\">" +
        "<div class=\"stat\"><span class=\"stat-n\">" + EVENTS.reduce(function(s,e){ return s + e.winners.length; }, 0) + "</span><div class=\"stat-l\">" + (multiEvent ? "Total Winners (All Activities)" : "Total Winners") + "</div></div>" +
      "</div></div>" +
      "<div class=\"body\">" +
        "<div class=\"section-lbl\">📋 Winner List</div>" +
        "<div class=\"toolbar\">" +
          "<span class=\"cnt-badge\" id=\"cnt\"></span>" +
          "<div class=\"search-wrap\"><span class=\"s-ic\">🔍</span><input type=\"text\" id=\"srch\" placeholder=\"Search character name or ID…\"></div>" +
        "</div>" +
        "<div class=\"tbl-wrap\"><div class=\"tbl-bar\"></div><table>" +
          "<colgroup><col style=\"width:50px\"><col style=\"width:180px\"><col style=\"width:220px\"><col style=\"width:165px\"><col style=\"width:120px\"><col style=\"width:95px\"></colgroup>" +
          "<thead><tr><th>#</th><th>Character Name</th><th>Account ID</th><th>Reward</th><th>Redeem</th><th>Status</th></tr></thead>" +
          "<tbody id=\"tbody\"></tbody>" +
        "</table></div>" +
        "<div class=\"fb-strip\"><div class=\"fb-label\">Official Facebook Pages</div>" +
          SV.fb.map(function(f){ return "<a class=\"fb-btn\" target=\"_blank\" rel=\"noopener\" href=\"" + su(f.url) + "\">" + esc(SV.brand) + " <span class=\"fb-tag\">" + esc(f.label) + "</span></a>"; }).join("") +
        "</div>" +
        "<div class=\"footer-bar\">" +
          "<span>" + esc(SV.brand).toUpperCase() + "</span><span class=\"footer-sep\">·</span>" +
          "<span id=\"footer-eventname\"></span><span class=\"footer-sep\">·</span>" +
          "<span id=\"footer-date\"></span>" +
        "</div>" +
      "</div>";
    document.getElementById("srch").addEventListener("input", refreshTable);
    if (multiEvent) document.querySelectorAll("#activity-tabs .ev-tab").forEach(function(b){ b.addEventListener("click", function(){ selectEvent(+b.getAttribute("data-i")); }); });
    selectEvent(0);
  }
  render();
})();
</script>
</body>
</html>
